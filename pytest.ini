[pytest]
# The commit-level test set. Fast, headless, no Slicer import, no data files.
#
# docs/16-TESTING_STRATEGY.md: this layer must stay fast, because the three cross-cutting
# assertions live in it precisely so that they can never be bypassed, and a slow commit gate
# gets bypassed.
#
# pythonpath rather than an installed package: none of these directories is a distributable,
# and an editable install would put a fourth way of resolving imports next to Slicer's
# interpreter and the pipeline venv. docs/14: do not mix Python environments.
#
# app/ being importable here is deliberate. Architectural seam 4, the evaluation harness
# never imports the application, is worth more as an assertion made while the application is
# on the path than as one made where the import could not have succeeded anyway.

testpaths =
    pipeline/tests
    eval/tests
    app/tests

pythonpath =
    pipeline
    eval
    app

addopts = -ra --strict-markers --strict-config

markers =
    orientation: the left/right assertion. Never skip, never mark xfail.
    known_answer: asserts against a value computed by hand, not against recorded output.
    seam: asserts an architectural seam from docs/03-ARCHITECTURE.md.
